name: plow
include:
  - public/compose.yaml

x-analysis: &analysis
  build:
    context: .
    dockerfile_inline: |
      FROM node:22.23.0-bookworm-slim@sha256:d9f850096136edbc402debdd8729579a288aac64574ada0ff4db26b6ae58b0b2
      WORKDIR /app
      COPY package.json package-lock.json ./
      RUN npm ci --ignore-scripts
      COPY tooling tooling
      RUN node --input-type=module -e 'import {prepareCompiler} from "./tooling/bend.ts"; await prepareCompiler("/app")'
      COPY collector collector
      COPY dashboard dashboard
      COPY evidence evidence
      ENV PLOW_BEND_BUNDLE=/app/compiler
  profiles: [analysis]
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: [/tmp]

services:
  analysis-refresh:
    <<: *analysis
    restart: unless-stopped
    entrypoint: [/bin/sh, -c, 'umask 077; while :; do node collector/wire.ts /tmp /input/forge/evidence.sqlite /input/codex/evidence.sqlite /receipts /analysis/evidence.sqlite || printf "%s\n" "Analysis refresh failed; retaining previous results" >&2; sleep 900; done']
    environment:
      PLOW_T3_ORIGIN: ${PLOW_ANALYSIS_T3_ORIGIN:-}
      PLOW_T3_READ_TOKEN_FILE: ${PLOW_ANALYSIS_T3_TOKEN_PATH:-}
      PLOW_ANALYSIS_T3_INSTANCE: ${PLOW_ANALYSIS_T3_INSTANCE:-}
      PLOW_ANALYSIS_CODEX_INSTANCE: ${PLOW_ANALYSIS_CODEX_INSTANCE:-}
    volumes:
      - ${PLOW_ANALYSIS_FORGE_DIR:-./.plow/analysis-forge}:/input/forge:ro
      - ${PLOW_ANALYSIS_CODEX_DIR:-./.plow/analysis-codex}:/input/codex:ro
      - ${PLOW_ANALYSIS_RECEIPTS_DIR:-./.plow/analysis-receipts}:/receipts:ro
      - analysis:/analysis

  analysis-api:
    <<: *analysis
    restart: unless-stopped
    command: [node, dashboard/prepare.ts, --analysis-api, /analysis/evidence.sqlite, "8080"]
    networks: [analysis-api]
    environment:
      PLOW_ANALYSIS_BIND_HOST: 0.0.0.0
      PLOW_ANALYSIS_USER: ${PLOW_ANALYSIS_USER:-}
    ports:
      - "127.0.0.1:${PLOW_ANALYSIS_PORT:-15480}:8080"
    volumes:
      - analysis:/analysis:ro

volumes:
  analysis:

networks:
  analysis-api:
