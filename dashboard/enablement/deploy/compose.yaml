services:
  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    command: [-target=all, -config.file=/etc/tempo.yml]
    tmpfs:
      - /var/tempo:uid=10001,gid=10001,mode=0700
    volumes:
      - ../../provisioning/tempo.yml:/etc/tempo.yml:ro
  tempo-replay:
    image: node:22.23.0-bookworm-slim@sha256:d9f850096136edbc402debdd8729579a288aac64574ada0ff4db26b6ae58b0b2
    profiles: [maintenance]
    user: "${BARNACLES_GRAFANA_UID}:${BARNACLES_GRAFANA_GID}"
    command: [node, /barnacles/load-tempo.ts, /barnacles/tempo.ndjson, "tempo:3200", "tempo:4318"]
    volumes:
      - ../../load-tempo.ts:/barnacles/load-tempo.ts:ro
      - type: bind
        source: ${BARNACLES_SNAPSHOT_DIR:?Run dashboard/run.sh with a prepared snapshot}/tempo.ndjson
        target: /barnacles/tempo.ndjson
        read_only: true
        bind:
          create_host_path: false
  grafana:
    image: ${BARNACLES_GRAFANA_IMAGE:-grafana/grafana:12.3.0@sha256:70d9599b186ce287be0d2c5ba9a78acb2e86c1a68c9c41449454d0fc3eeb84e8}
    user: "${BARNACLES_GRAFANA_UID:?Run dashboard/run.sh}:${BARNACLES_GRAFANA_GID:?Run dashboard/run.sh}"
    tmpfs:
      - /var/lib/grafana:uid=${BARNACLES_GRAFANA_UID},gid=${BARNACLES_GRAFANA_GID},mode=0700,exec
    ports:
      - "127.0.0.1:${BARNACLES_PORT:-3030}:3000"
    volumes:
      - type: bind
        source: ${BARNACLES_SNAPSHOT_DIR:?Run dashboard/run.sh with a prepared snapshot}/dashboard.sqlite
        target: /barnacles/dashboard.sqlite
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BARNACLES_SNAPSHOT_DIR}/dashboards
        target: /barnacles/dashboards
        read_only: true
        bind:
          create_host_path: false
      - ../../provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../../provisioning/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: frser-sqlite-datasource@4.0.9@https://github.com/fr-ser/grafana-sqlite-datasource/releases/download/v4.0.9/frser-sqlite-datasource-4.0.9.zip,marcusolsson-treemap-panel@2.1.1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_BASIC_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, http://127.0.0.1:3000/api/health]
      interval: 2s
      timeout: 2s
      retries: 45
