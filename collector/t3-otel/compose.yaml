name: plow-t3-otel
services:
  volume-init:
    image: node:22.23.0-bookworm-slim@sha256:d9f850096136edbc402debdd8729579a288aac64574ada0ff4db26b6ae58b0b2
    command: [install, -d, -m, '0700', -o, '10001', -g, '10001', /queue/data, /evidence/data]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: [no-new-privileges:true]
    volumes:
      - queue:/queue
      - evidence:/evidence

  traces:
    image: otel/opentelemetry-collector-contrib:0.166.0@sha256:3e18fe04181de50bdd72e23ad4a4d6214b54351e63d496f1c58127cc4541ad7f
    command: [--config=/etc/plow/t3.yaml]
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - '127.0.0.1:${PLOW_T3_OTLP_PORT:-4319}:4318'
    environment:
      PLOW_T3_INSTANCE: ${PLOW_T3_INSTANCE:?Set the trusted T3 instance identifier}
    networks: [default, storage]
    secrets: [t3_ingress, t3_backend]
    volumes:
      - ./otelcol.yaml:/etc/plow/t3.yaml:ro
      - queue:/queue
    depends_on:
      volume-init:
        condition: service_completed_successfully

  evidence:
    build: &t3-evidence-build
      context: ../..
      dockerfile_inline: |
        FROM node:22.23.0-bookworm-slim@sha256:d9f850096136edbc402debdd8729579a288aac64574ada0ff4db26b6ae58b0b2
        WORKDIR /app
        COPY package.json ./
        COPY tooling/bend.ts tooling/
        RUN node --input-type=module -e 'import {prepareCompiler} from "./tooling/bend.ts"; await prepareCompiler("/app")' && chmod -R a+rX /app/compiler
        COPY collector/codex/otel.ts collector/codex/
        COPY collector/t3-otel/history.bend collector/t3-otel/
        COPY collector/wire.ts collector/
        COPY evidence evidence
    entrypoint: [/bin/sh, -c, 'umask 077 && exec node collector/codex/otel.ts --t3 /evidence/data "$$PLOW_T3_INSTANCE"']
    environment:
      PLOW_BEND_BUNDLE: /app/compiler
      TMPDIR: /tmp
      PLOW_T3_EVIDENCE_HOST: 0.0.0.0
      PLOW_T3_INSTANCE: ${PLOW_T3_INSTANCE:?Set the trusted T3 instance identifier}
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [storage]
    secrets: [t3_backend]
    volumes:
      - evidence:/evidence
    tmpfs: [/tmp]
    depends_on:
      volume-init:
        condition: service_completed_successfully

  history:
    profiles: [history]
    build: *t3-evidence-build
    entrypoint: [/bin/sh, -c, 'umask 077 && exec node collector/codex/otel.ts --t3-history /evidence/data "$$PLOW_T3_INSTANCE" "$$@"', history]
    environment:
      PLOW_BEND_BUNDLE: /app/compiler
      TMPDIR: /tmp
      PLOW_T3_INSTANCE: ${PLOW_T3_INSTANCE:?Set the trusted T3 instance identifier}
      PLOW_T3_HISTORY_ORIGIN: ${PLOW_T3_HISTORY_ORIGIN:-}
      PLOW_T3_HISTORY_SCOPE: ${PLOW_T3_HISTORY_SCOPE:-allowlist}
      PLOW_T3_HISTORY_TARGETS_FILE: /run/plow-history-targets
    user: '10001:10001'
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    secrets: [t3_history_read]
    volumes:
      - evidence:/evidence
      - type: bind
        source: ${PLOW_T3_HISTORY_TARGETS_FILE:-/dev/null}
        target: /run/plow-history-targets
        read_only: true
        bind: {create_host_path: false}
    tmpfs: [/tmp]
    depends_on:
      volume-init:
        condition: service_completed_successfully

networks:
  storage:
    internal: true

volumes:
  queue:
  evidence:

secrets:
  t3_ingress:
    file: ${PLOW_T3_INGRESS_SECRET_FILE:?Set the private T3 ingress token file}
  t3_backend:
    file: ${PLOW_T3_BACKEND_SECRET_FILE:?Set the private T3 backend token file}
  t3_history_read:
    file: ${PLOW_T3_HISTORY_READ_TOKEN_FILE:-/dev/null}
