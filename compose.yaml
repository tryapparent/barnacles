name: plow
include:
  - public/compose.yaml
services:
  plow-dashboard:
    profiles: [dashboard]
    image: node:22.23.0-bookworm-slim@sha256:d9f850096136edbc402debdd8729579a288aac64574ada0ff4db26b6ae58b0b2
    command: [node, /app/worker.mjs]
    restart: unless-stopped
    read_only: true
    init: true
    user: "${PLOW_FRONTEND_UID_GID:-0:0}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:${PLOW_FRONTEND_PORT:-3033}:8080"
    environment:
      PLOW_ACCESS_TEAM: ${PLOW_ACCESS_TEAM:-}
      PLOW_ACCESS_AUDIENCE: ${PLOW_ACCESS_AUDIENCE:-}
      PLOW_RELEASE: ${PLOW_RELEASE:-}
      PLOW_SESSION_HISTORY_URL: ${PLOW_SESSION_HISTORY_URL:-}
    volumes:
      - type: bind
        source: ${PLOW_FRONTEND_ASSETS:-./.plow-assets}/worker.mjs
        target: /app/worker.mjs
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./node_modules/jose
        target: /app/node_modules/jose
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLOW_FRONTEND_FEED:-./.plow-feed}
        target: /feed
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/_health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 3s
      timeout: 2s
      retries: 5
