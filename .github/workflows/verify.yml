name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
  plow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec -- tsc -p dashboard/web/tsconfig.json
      - run: mkdir -p "$RUNNER_TEMP/plow" && node dashboard/plow/build.ts "$RUNNER_TEMP/plow"
      - run: node dashboard/plow/smoke.mjs "$RUNNER_TEMP/plow"
      - run: |
          export PLOW_FRONTEND_ASSETS="$RUNNER_TEMP/plow"
          export PLOW_FRONTEND_FEED="$RUNNER_TEMP/plow-feed"
          export PLOW_RELEASE="$GITHUB_SHA"
          mkdir -m 700 "$PLOW_FRONTEND_FEED"
          printf '%s\n' '{"observed":0,"traces":[]}' > "$PLOW_FRONTEND_FEED/timeline.json"
          trap 'docker compose -p plow-dashboard-check down' EXIT
          docker compose -p plow-dashboard-check up -d --wait plow-dashboard
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3033/_health)" = 204
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3033/app)" = 403
        env:
          PLOW_ACCESS_TEAM: fixture
          PLOW_ACCESS_AUDIENCE: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  collector-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_id == '1473191494'
    needs: [verify, plow]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          stage="$RUNNER_TEMP/collector"
          mkdir -p "$stage/source"
          git archive "$GITHUB_SHA" | tar -x -C "$stage/source"
          printf '%s\n' "$GITHUB_SHA" > "$stage/revision"
          tar -C "$stage" -czf "$RUNNER_TEMP/plow-collector.tar.gz" revision source
        shell: bash
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/plow-collector.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plow-collector-${{ github.sha }}
          path: ${{ runner.temp }}/plow-collector.tar.gz
          if-no-files-found: error
