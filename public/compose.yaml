services:
  plow-public:
    image: caddy:2.10-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    command: [caddy, file-server, --root, /srv, --listen, ":8080"]
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:${PLOW_SITE_PORT:-3032}:8080"
    volumes:
      - type: bind
        source: ./index.html
        target: /srv/index.html
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./brand
        target: /srv/brand
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./assets
        target: /srv/assets
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/brand/]
      interval: 5s
      timeout: 3s
      retries: 5
