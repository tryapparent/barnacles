name: Verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify -- dashboard
        env:
          PLOW_COMPOSE_SMOKE: '1'
  plow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm exec -- tsc -p dashboard/web/tsconfig.json
      - run: mkdir -p "$RUNNER_TEMP/plow" && node dashboard/plow/build.ts "$RUNNER_TEMP/plow"
      - run: node dashboard/plow/smoke.mjs "$RUNNER_TEMP/plow"
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plow-worker
          path: ${{ runner.temp }}/plow/worker.mjs
          if-no-files-found: error
          retention-days: 3
  collector-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_id == '1473191494'
    needs: [verify, compose, plow]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: |
          stage="$RUNNER_TEMP/collector"
          mkdir -p "$stage/source"
          git archive "$GITHUB_SHA" | tar -x -C "$stage/source"
          printf '%s\n' "$GITHUB_SHA" > "$stage/revision"
          tar -C "$stage" -czf "$RUNNER_TEMP/plow-collector.tar.gz" revision source
        shell: bash
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: ${{ runner.temp }}/plow-collector.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: plow-collector-${{ github.sha }}
          path: ${{ runner.temp }}/plow-collector.tar.gz
          if-no-files-found: error
  deploy-plow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository_id == '1473191494'
    needs: [verify, compose, plow]
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment:
      name: plow-production
      url: https://plow.tryapparent.com/app
    concurrency:
      group: plow-production
      queue: max
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: plow-worker
          path: ${{ runner.temp }}/plow
      - run: node dashboard/plow/deploy.ts "$RUNNER_TEMP/plow/worker.mjs"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.PLOW_CLOUDFLARE_ACCOUNT_ID }}
          PLOW_ACCESS_AUDIENCE: ${{ vars.PLOW_ACCESS_AUDIENCE }}
          PLOW_SESSION_NAMESPACE_ID: ${{ vars.PLOW_SESSION_NAMESPACE_ID }}
          PLOW_WORKER_TOKEN: ${{ secrets.PLOW_WORKER_TOKEN }}
          PLOW_SESSION_HISTORY_URL: ${{ secrets.PLOW_SESSION_HISTORY_URL }}
